name: Check scaffold structure and syntax
on:
  push:
  pull_request:
jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structure and syntax only - not functional tests
        run: python scripts/check_structure.py
